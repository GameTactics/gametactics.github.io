<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>国内AI工具 · 全AI导航</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f0f2f8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:20px;}
        .container{max-width:1400px;margin:0 auto;background:white;border-radius:32px;padding:30px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.03);border:1px solid #eef2f8;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
        .back{color:#ff7b2c;text-decoration:none;font-weight:500;}
        .btn-foreign{background:#ff7b2c;color:white;padding:8px 20px;border-radius:40px;text-decoration:none;font-weight:500;transition:0.2s;}
        .btn-foreign:hover{background:#e66b1f;}
        h1{color:#ff7b2c;font-size:1.8rem;margin-bottom:8px;}
        .ad{background:#f8fafc;border-radius:24px;padding:14px;text-align:center;margin:20px 0;border:1px dashed #cbd5e1;font-size:0.75rem;color:#6c7f8f;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:24px 16px;margin:30px 0;}
        .tool-card{background:#f8fafc;border-radius:24px;padding:20px 12px;text-align:center;cursor:pointer;transition:all 0.2s ease;border:1px solid #eef2f8;}
        .tool-card:hover{background:#fff7e5;transform:translateY(-3px);border-color:#ffd7b5;}
        .tool-icon{width:64px;height:64px;margin:0 auto 12px;}
        .tool-icon img{width:100%;height:100%;object-fit:contain;}
        .tool-name{font-size:0.95rem;font-weight:600;color:#1e2a3e;}
        .footer{text-align:center;margin-top:30px;font-size:0.7rem;color:#8ba0bc;}
        @media (max-width:550px){
            .grid{grid-template-columns:repeat(2,1fr);gap:16px;}
            .tool-icon{width:48px;height:48px;}
            .tool-name{font-size:0.85rem;}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <a href="index.html" class="back">← 返回首页</a>
        <a href="list-en.html" class="btn-foreign">🌍 国外AI</a>
    </div>

    <div class="ad">📢 Google AdSense 广告位（顶部）</div>

        <div class="tool-card" onclick="location.href='ai-deepseek.html'"><div class="tool-icon"><img src="deepseek.jpg" alt="DeepSeek"></div><div class="tool-name">DeepSeek</div></div>
        <div class="tool-card" onclick="location.href='ai-kimi.html'"><div class="tool-icon"><img src="kimi.jpg" alt="Kimi"></div><div class="tool-name">Kimi</div></div>
        <div class="tool-card" onclick="location.href='ai-tongyi.html'"><div class="tool-icon"><img src="tongyi.jpg" alt="通义千问"></div><div class="tool-name">通义千问</div></div>
        <div class="tool-card" onclick="location.href='ai-wenxin.html'"><div class="tool-icon"><img src="wenxin.jpg" alt="文心一言"></div><div class="tool-name">文心一言</div></div>
        <div class="tool-card" onclick="location.href='ai-xunfei.html'"><div class="tool-icon"><img src="xunfei.jpg" alt="讯飞星火"></div><div class="tool-name">讯飞星火</div></div>
        <div class="tool-card" onclick="location.href='ai-tencent.html'"><div class="tool-icon"><img src="tencent.jpg" alt="腾讯元宝"></div><div class="tool-name">腾讯元宝</div></div>
        <div class="tool-card" onclick="location.href='ai-zhipu.html'"><div class="tool-icon"><img src="zhipu.jpg" alt="智谱清言"></div><div class="tool-name">智谱清言</div></div>
        <div class="tool-card" onclick="location.href='ai-hailuo.html'"><div class="tool-icon"><img src="hailuo.jpg" alt="海螺AI"></div><div class="tool-name">海螺AI</div></div>
        <div class="tool-card" onclick="location.href='ai-tiangong.html'"><div class="tool-icon"><img src="tiangong.jpg" alt="天工AI"></div><div class="tool-name">天工AI</div></div>
        <div class="tool-card" onclick="location.href='ai-jieyue.html'"><div class="tool-icon"><img src="jieyue.jpg" alt="阶跃AI"></div><div class="tool-name">阶跃AI</div></div>
        <div class="tool-card" onclick="location.href='ai-夸克.html'"><div class="tool-icon"><img src="kuake.jpg" alt="夸克"></div><div class="tool-name">夸克</div></div>
        <div class="tool-card" onclick="location.href='ai-baichuan.html'"><div class="tool-icon"><img src="baichuan.jpg" alt="百川AI"></div><div class="tool-name">百川AI</div></div>
        <div class="tool-card" onclick="location.href='ai-nami.html'"><div class="tool-icon"><img src="nami.jpg" alt="纳米AI"></div><div class="tool-name">纳米AI</div></div>
        <div class="tool-card" onclick="location.href='ai-afu.html'"><div class="tool-icon"><img src="afu.jpg" alt="蚂蚁阿福"></div><div class="tool-name">蚂蚁阿福</div></div>
        <div class="tool-card" onclick="location.href='ai-xiaoque.html'"><div class="tool-icon"><img src="xiaoque.jpg" alt="小云雀"></div><div class="tool-name">小云雀</div></div>
    </div>
    <div class="ad">📢 Google AdSense 广告位（底部）</div>
    <div class="footer">✅ 点击卡片查看详细价格与购买链接</div>
</div>
</body>
</html>
